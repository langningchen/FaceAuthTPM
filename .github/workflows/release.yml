# SPDX-License-Identifier: GPL-3.0-only
name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025-vs2026
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Build binaries and release assets
        shell: powershell
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $version = (Get-Content .\VERSION.txt -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION.txt ($version). Expected v$version."
          }
          .\scripts\package-release.ps1 -Version $version

      # Optional Authenticode signing. Add both repository secrets to enable it:
      # WINDOWS_CERTIFICATE_BASE64 = base64-encoded PFX
      # WINDOWS_CERTIFICATE_PASSWORD = PFX password
      - name: Sign installer when certificate secrets are configured
        shell: powershell
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_B64)) {
            Write-Host 'No signing certificate configured; leaving installer unsigned.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'faceauth-release.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -File -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found.' }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:CERT_PASSWORD .\dist\FaceAuthTPM-Setup.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item -Force $pfx

      - name: Verify release asset set
        shell: powershell
        run: |
          $files = @(Get-ChildItem .\dist -File)
          if ($files.Count -ne 2) { throw "Expected exactly 2 release files, got $($files.Count)." }
          foreach ($name in @('FaceAuthTPM-Setup.exe','FaceAuthTPM-Configure.ps1')) {
            if (-not (Test-Path ".\dist\$name")) { throw "Missing release file: $name" }
          }
          Get-FileHash .\dist\* -Algorithm SHA256 | Format-Table -AutoSize

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceAuthTPM-release
          path: |
            dist/FaceAuthTPM-Setup.exe
            dist/FaceAuthTPM-Configure.ps1
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          files: |
            dist/FaceAuthTPM-Setup.exe
            dist/FaceAuthTPM-Configure.ps1
